name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read is all any job here needs: nothing publishes, comments or writes a tag.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, format and the suite across every supported interpreter, from the shared workflow.
  #
  # This repository used to write those commands out itself, and so did the other four, and so
  # would the eleven still to come. A change to shared plumbing, an action version bump or a new
  # gate, is now one file instead of sixteen sittings.
  #
  # Pinned to a tag rather than to @main deliberately: a reusable workflow tracking a moving
  # branch means a commit somewhere else can turn this badge red with nothing changed here.
  #
  # What the pipeline is for, and the five things it deliberately does not gate, is written down:
  # https://github.com/PNX89/.github/blob/main/docs/adr/0001-what-ci-is-for.md
  checks:
    name: checks
    uses: PNX89/.github/.github/workflows/checks.yml@v1
    with:
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
